# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: Schatten local OIDC application
  labels:
    blueprints.goauthentik.io/description: Local-only Schatten OIDC provider and development identities
entries:
  - model: authentik_providers_oauth2.scopemapping
    id: schatten-scope-openid
    identifiers:
      name: Schatten local openid scope
    attrs:
      scope_name: openid
      expression: |
        return {}

  - model: authentik_providers_oauth2.scopemapping
    id: schatten-scope-profile
    identifiers:
      name: Schatten local profile scope
    attrs:
      scope_name: profile
      expression: |
        return {
            "name": request.user.name,
        }

  - model: authentik_providers_oauth2.scopemapping
    id: schatten-scope-email
    identifiers:
      name: Schatten local verified email scope
    attrs:
      scope_name: email
      expression: |
        return {
            "email": request.user.email,
            "email_verified": request.user.attributes.get("email_verified") is True,
        }

  - model: authentik_providers_oauth2.oauth2provider
    id: schatten-provider
    identifiers:
      name: Schatten local OIDC provider
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: schatten-local
      client_secret: !Env SCHATTEN_OIDC_CLIENT_SECRET
      grant_types:
        - authorization_code
      include_claims_in_id_token: true
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      property_mappings:
        - !KeyOf schatten-scope-openid
        - !KeyOf schatten-scope-profile
        - !KeyOf schatten-scope-email
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: http://app.localhost:5173/api/v1/auth/callback
          redirect_uri_type: authorization
        - matching_mode: strict
          url: http://app.localhost:5173/login
          redirect_uri_type: logout

  - model: authentik_core.application
    identifiers:
      slug: schatten
    attrs:
      name: Schatten
      provider: !KeyOf schatten-provider
      meta_launch_url: http://app.localhost:5173

  - model: authentik_core.user
    identifiers:
      username: schatten-consultant
    attrs:
      name: Development Consultant
      email: consultant@example.local
      is_active: true
      password_hash: !Env AUTHENTIK_CONSULTANT_PASSWORD_HASH
      attributes:
        email_verified: true

  - model: authentik_core.user
    identifiers:
      username: schatten-admin
    attrs:
      name: Development Admin
      email: admin@example.local
      is_active: true
      password_hash: !Env AUTHENTIK_ADMIN_PASSWORD_HASH
      attributes:
        email_verified: true

  - model: authentik_core.user
    identifiers:
      username: schatten-unmatched
    attrs:
      name: Unmatched Development User
      email: unmatched@example.local
      is_active: true
      password_hash: !Env AUTHENTIK_UNMATCHED_PASSWORD_HASH
      attributes:
        email_verified: true
