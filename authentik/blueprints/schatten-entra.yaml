# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: Schatten local Entra verified email mapping
  labels:
    blueprints.goauthentik.io/instantiate: "false"
    blueprints.goauthentik.io/description: Marks email returned by the trusted Entra source as verified
entries:
  - model: authentik_sources_oauth.oauthsourcepropertymapping
    identifiers:
      name: Schatten Entra source verified email
    attrs:
      expression: |
        email = info.get("mail")
        if not email:
            other_emails = info.get("otherMails") or []
            email = other_emails[0] if other_emails else None
        return {
            "email": email,
            "attributes": {
                "email_verified": bool(email),
            },
            "groups": [],
        }
