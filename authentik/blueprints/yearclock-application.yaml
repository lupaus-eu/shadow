# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
version: 1
metadata:
  name: Yearclock OIDC application
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - id: yearclock-email-scope
    model: authentik_providers_oauth2.scopemapping
    state: present
    identifiers:
      name: Yearclock verified email
    attrs:
      scope_name: email
      description: Yearclock email address and explicit verification state
      expression: |
        return {
          "email": request.user.email,
          "email_verified": bool(
            request.user.attributes.get("yearclock_email_verified", False)
          ),
        }

  - id: yearclock-provider
    model: authentik_providers_oauth2.oauth2provider
    state: present
    identifiers:
      name: Yearclock
    attrs:
      client_type: confidential
      client_id: !Env OIDC_CLIENT_ID
      client_secret: !Env OIDC_CLIENT_SECRET
      grant_types:
        - authorization_code
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      redirect_uris:
        - matching_mode: strict
          redirect_uri_type: authorization
          url: !Env OIDC_REDIRECT_URI
        - matching_mode: strict
          redirect_uri_type: logout
          url: !Env FRONTEND_URL
        - matching_mode: strict
          redirect_uri_type: logout
          url: !Format ["%s/platform", !Env FRONTEND_URL]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !KeyOf yearclock-email-scope
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      issuer_mode: per_provider

  - model: authentik_core.application
    state: present
    identifiers:
      slug: yearclock
    attrs:
      name: Yearclock
      provider: !KeyOf yearclock-provider
      policy_engine_mode: any
      meta_launch_url: !Env FRONTEND_URL
