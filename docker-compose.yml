services:
  database:
    # Use 18.0 locally because the official 18.0.4 image is not available yet.
    # Revisit this pin for production deployment once the managed 18.0.4 target is available.
    image: postgres:18.0
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-schatten}
      POSTGRES_USER: ${DATABASE_USER:-schatten}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-schatten_dev_password}
    volumes:
      - database_data:/var/lib/postgresql

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://schatten:schatten_dev_password@database:5432/schatten}
      APP_ENV: ${APP_ENV:-development}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_CALLBACK_PATH: ${OIDC_CALLBACK_PATH:-/api/v1/auth/callback}
      OIDC_ALLOWED_SIGNING_ALGORITHMS: ${OIDC_ALLOWED_SIGNING_ALGORITHMS:-RS256}
      OIDC_REQUIRE_VERIFIED_EMAIL: ${OIDC_REQUIRE_VERIFIED_EMAIL:-true}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:5173}
      APP_ALLOWED_ORIGIN: ${APP_ALLOWED_ORIGIN:-http://localhost:5173}
      TRUSTED_CADDY_PEER_CIDRS: ${TRUSTED_CADDY_PEER_CIDRS:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      AUTH_SESSION_IDLE_TIMEOUT_SECONDS: ${AUTH_SESSION_IDLE_TIMEOUT_SECONDS:-1800}
      AUTH_SESSION_ABSOLUTE_LIFETIME_SECONDS: ${AUTH_SESSION_ABSOLUTE_LIFETIME_SECONDS:-28800}
      AUTH_SESSION_ACTIVITY_WRITE_SECONDS: ${AUTH_SESSION_ACTIVITY_WRITE_SECONDS:-300}
      OIDC_TRANSACTION_LIFETIME_SECONDS: ${OIDC_TRANSACTION_LIFETIME_SECONDS:-600}
    depends_on:
      - database
    volumes:
      - ./backend:/app
      - backend_uv_cache:/root/.cache/uv
      - backend_venv:/app/.venv

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      VITE_DEV_API_PROXY_TARGET: ${FRONTEND_DEV_API_PROXY_TARGET:-http://backend:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  frontend-preview:
    profiles:
      - preview
    build:
      context: ./frontend
      target: preview
    ports:
      - "4173:4173"

  diagram-renderer:
    profiles:
      - docs
    build:
      context: ./docs/diagrams
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /workspace/docs/diagrams
    volumes:
      - .:/workspace
    command: ["-tsvg", "-o", "generated", "db-physical-schema.puml"]

volumes:
  backend_uv_cache:
  backend_venv:
  database_data:
  frontend_node_modules:
