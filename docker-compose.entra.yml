services:
  authentik-entra-config:
    image: ghcr.io/goauthentik/server:2026.5.6@sha256:ed120caf710ccf82ef0026f0bc74e51615bc95ebff228a7a2d6fc60c441c3868
    entrypoint: ["sh", "/config/configure-entra.sh"]
    environment:
      AUTHENTIK_POSTGRESQL__HOST: authentik-database
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL_PASSWORD:-}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      ENTRA_APPLICATION_CLIENT_ID: ${ENTRA_APPLICATION_CLIENT_ID:?Set ENTRA_APPLICATION_CLIENT_ID in .env.entra.local}
      ENTRA_DIRECTORY_TENANT_ID: ${ENTRA_DIRECTORY_TENANT_ID:?Set ENTRA_DIRECTORY_TENANT_ID in .env.entra.local}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:?Set ENTRA_CLIENT_SECRET in .env.entra.local}
    depends_on:
      authentik-database:
        condition: service_healthy
      authentik-server:
        condition: service_healthy
      authentik-worker:
        condition: service_started
    restart: "no"
    volumes:
      - ./authentik/configure-entra.sh:/config/configure-entra.sh:ro
      - ./authentik/blueprints/schatten-entra.yaml:/blueprints/schatten-entra.yaml:ro
      - ./authentik/blueprints/schatten-entra-source.yaml:/blueprints/schatten-entra-source.yaml:ro
      - ./authentik/blueprints/schatten-entra-identification.yaml:/blueprints/schatten-entra-identification.yaml:ro

  backend:
    depends_on:
      authentik-entra-config:
        condition: service_completed_successfully
