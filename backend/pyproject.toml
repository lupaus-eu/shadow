[project]
name = "schatten-backend"
version = "0.1.0"
description = "Schatten FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.10.0",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.0",
    "authlib>=1.6.0,<2.0.0",
    "numpy>=2.0.0,<3.0.0",
    "mlforecast>=1.0.2,<2.0.0",
    "scikit-learn>=1.6.0,<2.0.0",
    "statsmodels>=0.14.0,<1.0.0",
    "prophet>=1.1.6,<2",
    "fastmcp>=4.1.4,<5",
]

[dependency-groups]
dev = [
    "httpx2>=2.0.0",
    "pyright>=1.1.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # pandas 2.3 Timedelta under NumPy >= 2.5; fixed in pandas 3, which is blocked by mlforecast 1.1.0 (pandas<3).
    "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning:prophet\\.forecaster",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["app", "tests"]
venv = ".venv"
venvPath = "."

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
