#cloud-config
# Prepares a fresh Ubuntu LTS host (UpCloud) for the Yearclock production stack:
# Docker with the Compose plugin, restic and git, 2 GB of swap, a host firewall,
# and automatic security updates. Paste it into the server's "User data" field when
# creating the host (docs/runbooks/first-deployment.md, section 3).
#
# It installs tools only. It holds no secret, copies no repository file, and does
# not start the stack: the registry login, `.env.production`, and `docker compose`
# are the steps in first-deployment.md sections 4 and 5. UpCloud's own firewall is
# the primary one; ufw here is a second layer. Progress is in
# /var/log/cloud-init-output.log; /var/lib/yearclock-init.done appears when it ends.

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - git
  - make
  - restic
  - ufw
  - fail2ban
  - unattended-upgrades

# 2 GB of swap keeps a 2 GB host alive through Authentik's start-up peak.
swap:
  filename: /swapfile
  size: 2G
  maxsize: 2G

runcmd:
  # Docker Engine and the Compose plugin from Docker's own apt repository.
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - sh -c 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list'
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable --now docker
  # Host firewall: SSH, HTTP, and HTTPS only. Only Caddy publishes ports.
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - systemctl enable --now fail2ban
  # Directory for the repository files and .env.production.
  - mkdir -p /opt/yearclock
  - touch /var/lib/yearclock-init.done
