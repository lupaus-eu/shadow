name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  repository-baseline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Check required project documents
        run: |
          test -f AGENTS.md
          test -f ARCHITECTURE.md
          test -f AI-FIRST-ENGINEERING-HANDBOOK.md
          test -f CONTRIBUTING.md
          test -f README.md
          test -f docs/AI-DEVELOPMENT-WORKFLOW.md
          test -f docs/LOCAL-DEVELOPMENT.md
          test -f docs/TESTING.md
          test -f docs/DEPLOYMENT.md
          test -f docs/domains/DOMAIN.md
          test -f docs/domains/DOMAIN-TEMPLATE.md
          test -f docs/concepts/CONCEPTS.md
          test -f docs/concepts/CONCEPT-TEMPLATE.md
          test -f docs/data/DATA-MODEL.md
          test -f docs/data/DATABASE.md
          test -f docs/diagrams/README.md
          test -f docs/decisions/ADR-TEMPLATE.md
          test -f docs/decisions/ADR-001-tech-stack.md
          test -f docs/decisions/ADR-002-database-migrations.md
          test -f docs/decisions/ADR-003-coolify-deployment.md
          test -f docs/decisions/ADR-004-authentication.md
          test -f docs/decisions/ADR-005-production-only-environments.md
          test -f docs/qa/AUTHENTICATION-QA-CHECKLIST.md
          test -f docs/qa/PREDICTION-WORKER-RUNTIME-QA.md
          test -f docs/diagrams/component-authentication-topology.puml
          test -f docs/diagrams/generated/component-authentication-topology.svg
          test -f docs/diagrams/sequence-oidc-login.puml
          test -f docs/diagrams/generated/sequence-oidc-login.svg
          test -f db/migrations/README.md
          test -f db/init/README.md
          test -f tasks/TASK-TEMPLATE.md
          test -f tasks/TASK-038-automatic-deployment-migrations.md
          test -f docker-compose.production.yml
          test -f deploy/ofelia/config.ini
          test -f docs/qa/PRODUCTION-RUNTIME-QA.md
          test -f docs/qa/UPCLOUD-RUNBOOK-QA.md
          test -f docs/qa/SOURCE-DELIVERY-QA.md
          test -f docs/PRODUCTION-RUNBOOK.md
          test -x deploy/bin/audit-host
          test -x deploy/bin/schatten-receive
          test -x deploy/bin/upload-gate
          test -x deploy/bin/service
          test -f deploy/Makefile
          test -x .github/scripts/create-source-manifest.sh
          test -x .github/scripts/prepare-production-upload.sh
          test -x .github/scripts/verify-upload-gate.sh
          test -x .github/scripts/verify-wait-for-healthy.sh
          test -f .github/workflows/deploy-production.yml
          test -f .github/scripts/verify-production-worker.sh
          test -f .github/scripts/verify-production-runtime.sh
          test ! -e docker-compose.coolify.yml
          test ! -e docker-compose.release.yml
          test -f frontend/Caddyfile
          test -f .github/PULL_REQUEST_TEMPLATE.md

      - name: Explain CI status
        run: |
          echo "Repository baseline documents are present."

  backend-checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: docker.io/library/postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_DB: schatten_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d schatten_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Lint backend
        working-directory: backend
        run: uv run ruff check .

      - name: Test backend
        working-directory: backend
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schatten_test
        run: uv run pytest

      - name: Typecheck backend
        working-directory: backend
        run: uv run pyright

      - name: Validate production Compose
        run: bash .github/scripts/verify-production-compose.sh

      - name: Build production backend image
        run: >-
          docker build
          --target production
          --tag schatten-backend:${{ github.sha }}
          --file backend/Dockerfile
          .

      - name: Verify packaged migrations and reference seed
        run: |
          export EXPECTED_UP_MIGRATIONS="$(
            find db/migrations -maxdepth 1 -type f -name '*.sql' ! -name '*.down.sql' -printf '%f\n' \
              | LC_ALL=C sort
          )"
          docker run --rm \
            --env EXPECTED_UP_MIGRATIONS \
            --workdir /tmp \
            --entrypoint python \
            schatten-backend:${{ github.sha }} \
            -c "import importlib.util, os; from app.core.migrations import discover_migrations; from app.seed_reference_data import REFERENCE_JSON_PATH, REFERENCE_SQL_PATH; migrations = discover_migrations(); assert [migration.up_name for migration in migrations] == os.environ['EXPECTED_UP_MIGRATIONS'].splitlines(); assert REFERENCE_SQL_PATH.is_file(); assert REFERENCE_JSON_PATH.is_file(); assert not REFERENCE_SQL_PATH.with_name('002_seed_development_data.sql').exists(); assert importlib.util.find_spec('pytest') is None; assert os.getuid() == 10001; assert os.getgid() == 10001"

      - name: Verify release migration and production API
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schatten_test
          BACKEND_IMAGE: schatten-backend:${{ github.sha }}
          APP_ENV: test
          PUBLIC_ORIGIN: http://127.0.0.1:8000
          APP_ALLOWED_ORIGIN: http://127.0.0.1:8000
        run: |
          docker run --rm --network host \
            --env DATABASE_URL \
            "$BACKEND_IMAGE" python migrate.py up
          docker run --rm --network host \
            --env DATABASE_URL \
            "$BACKEND_IMAGE" python migrate.py up

          docker run --rm --network host \
            --env DATABASE_URL \
            --workdir /tmp \
            "$BACKEND_IMAGE" python -m app.seed_reference_data
          docker run --rm --network host \
            --env DATABASE_URL \
            --workdir /tmp \
            "$BACKEND_IMAGE" python -m app.seed_reference_data

          backend_container_id="$(docker run --detach --network host \
            --env DATABASE_URL \
            --env APP_ENV \
            --env PUBLIC_ORIGIN \
            --env APP_ALLOWED_ORIGIN \
            "$BACKEND_IMAGE")"
          trap 'docker rm --force "$backend_container_id"' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done

          docker logs "$backend_container_id"
          exit 1

      - name: Verify production prediction worker image lifecycle
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schatten_test
          BACKEND_IMAGE: schatten-backend:${{ github.sha }}
        run: bash .github/scripts/verify-production-worker.sh

      - name: Verify migration failure blocks Compose backend startup
        env:
          BACKEND_IMAGE: schatten-backend:${{ github.sha }}
        run: bash .github/scripts/verify-release-compose-failure.sh

  frontend-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check frontend formatting
        working-directory: frontend
        run: pnpm format:check

      - name: Lint frontend
        working-directory: frontend
        run: pnpm lint

      - name: Test frontend
        working-directory: frontend
        run: pnpm test

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Build production frontend image
        run: >-
          docker build
          --target production
          --tag schatten-frontend:${{ github.sha }}
          --file frontend/Dockerfile
          frontend

      - name: Verify production frontend security boundary
        env:
          FRONTEND_IMAGE: schatten-frontend:${{ github.sha }}
        run: bash .github/scripts/verify-production-frontend.sh

  production-runtime:
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]

    steps:
      - uses: actions/checkout@v5

      - name: Check operator and runtime scripts
        run: |
          for script in deploy/bin/* deploy/ops/*.sh deploy/lib/common.sh .github/scripts/*.sh; do
            if head -n 1 "${script}" | grep -q python; then
              python3 -c "import ast, sys; ast.parse(open(sys.argv[1]).read())" "${script}"
            else
              bash -n "${script}"
            fi
          done
          shellcheck --severity=warning deploy/bin/check-host deploy/bin/init-state \
            deploy/bin/build-release deploy/bin/deploy-release deploy/bin/backup-now \
            deploy/bin/restore-rehearsal deploy/bin/initialize deploy/bin/docker-cleanup \
            deploy/bin/retire-release deploy/bin/ops-status deploy/bin/audit-host deploy/lib/common.sh \
            deploy/ops/backup.sh deploy/ops/restore-check.sh deploy/ops/docker-cleanup.sh \
            .github/scripts/verify-production-runtime.sh .github/scripts/create-source-manifest.sh \
            deploy/bin/upload-gate .github/scripts/prepare-production-upload.sh \
            .github/scripts/verify-upload-gate.sh deploy/bin/service \
            .github/scripts/verify-wait-for-healthy.sh
          make -s -C deploy help >/dev/null

      - name: Lint the Deploy to production workflow
        run: >-
          docker run --rm --volume "${PWD}:/repo:ro" --workdir /repo
          rhysd/actionlint:1.7.9@sha256:a0383f60d92601e2694e24b24d37df7b6a40bed7cedbc447611c50009bf02d94
          .github/workflows/deploy-production.yml

      - name: Verify release health gate tolerance
        run: bash .github/scripts/verify-wait-for-healthy.sh

      - name: Verify production runtime on an isolated Docker daemon
        run: bash .github/scripts/verify-production-runtime.sh
