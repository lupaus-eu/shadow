name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  repository-baseline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Check required project documents
        run: |
          test -f AGENTS.md
          test -f ARCHITECTURE.md
          test -f AI-FIRST-ENGINEERING-HANDBOOK.md
          test -f CONTRIBUTING.md
          test -f README.md
          test -f docs/AI-DEVELOPMENT-WORKFLOW.md
          test -f docs/LOCAL-DEVELOPMENT.md
          test -f docs/TESTING.md
          test -f docs/DEPLOYMENT.md
          test -f docs/domains/DOMAIN.md
          test -f docs/domains/DOMAIN-TEMPLATE.md
          test -f docs/concepts/CONCEPTS.md
          test -f docs/concepts/CONCEPT-TEMPLATE.md
          test -f docs/data/DATA-MODEL.md
          test -f docs/data/DATABASE.md
          test -f docs/diagrams/README.md
          test -f docs/decisions/ADR-TEMPLATE.md
          test -f docs/decisions/ADR-001-tech-stack.md
          test -f docs/decisions/ADR-002-database-migrations.md
          test -f docs/decisions/ADR-003-coolify-deployment.md
          test -f docs/decisions/ADR-004-authentication.md
          test -f docs/decisions/ADR-005-production-only-environments.md
          test -f docs/qa/AUTHENTICATION-QA-CHECKLIST.md
          test -f docs/qa/PREDICTION-WORKER-RUNTIME-QA.md
          test -f docs/diagrams/component-authentication-topology.puml
          test -f docs/diagrams/generated/component-authentication-topology.svg
          test -f docs/diagrams/sequence-oidc-login.puml
          test -f docs/diagrams/generated/sequence-oidc-login.svg
          test -f db/migrations/README.md
          test -f db/init/README.md
          test -f tasks/TASK-TEMPLATE.md
          test -f tasks/TASK-038-automatic-deployment-migrations.md
          test -f docker-compose.release.yml
          test -f docker-compose.production.yml
          test -f docker-compose.coolify.yml
          test -f .github/scripts/verify-production-worker.sh
          test -f frontend/Caddyfile
          test -f .github/PULL_REQUEST_TEMPLATE.md

      - name: Explain CI status
        run: |
          echo "Repository baseline documents are present."

  backend-checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.0
        env:
          POSTGRES_DB: schatten_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d schatten_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Lint backend
        working-directory: backend
        run: uv run ruff check .

      - name: Test backend
        working-directory: backend
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schatten_test
        run: uv run pytest

      - name: Typecheck backend
        working-directory: backend
        run: uv run pyright

      - name: Validate production Compose
        env:
          BACKEND_IMAGE: schatten-backend:${{ github.sha }}
          FRONTEND_IMAGE: schatten-frontend:${{ github.sha }}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schatten_test
          OIDC_DISCOVERY_URL: https://login.microsoftonline.com/tenant-id/v2.0/.well-known/openid-configuration
          OIDC_ISSUER: https://login.microsoftonline.com/tenant-id/v2.0
          OIDC_CLIENT_ID: test-client
          OIDC_CLIENT_SECRET: test-secret
          PUBLIC_ORIGIN: https://app.example.test
          TRUSTED_CADDY_PEER_CIDRS: 172.30.0.0/24
          CADDY_TRUSTED_PROXY_CIDRS: 172.29.0.0/24
        run: bash .github/scripts/verify-production-compose.sh

      - name: Validate Coolify release identity and standard Compose fields
        env:
          COOLIFY_RESOURCE_UUID: ci-resource
          SOURCE_COMMIT: ${{ github.sha }}
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schatten_test
          OIDC_DISCOVERY_URL: https://login.microsoftonline.com/tenant-id/v2.0/.well-known/openid-configuration
          OIDC_ISSUER: https://login.microsoftonline.com/tenant-id/v2.0
          OIDC_CLIENT_ID: test-client
          OIDC_CLIENT_SECRET: test-secret
          PUBLIC_ORIGIN: https://app.example.test
          TRUSTED_CADDY_PEER_CIDRS: 172.30.0.0/24
          CADDY_TRUSTED_PROXY_CIDRS: 172.29.0.0/24
        run: |
          sed '/exclude_from_hc:/d' docker-compose.coolify.yml \
            | docker compose -f - config --format json \
            | python3 -c 'import json, sys; services=json.load(sys.stdin)["services"]; backend="schatten-backend-ci-resource:${{ github.sha }}"; frontend="schatten-frontend-ci-resource:${{ github.sha }}"; assert services["migration"]["image"] == backend; assert services["backend"]["image"] == backend; assert services["prediction-worker"]["image"] == backend; assert services["frontend"]["image"] == frontend'

      - name: Build production backend image
        run: >-
          docker build
          --target production
          --tag schatten-backend:${{ github.sha }}
          --file backend/Dockerfile
          .

      - name: Verify packaged migrations
        run: |
          export EXPECTED_UP_MIGRATIONS="$(
            find db/migrations -maxdepth 1 -type f -name '*.sql' ! -name '*.down.sql' -printf '%f\n' \
              | LC_ALL=C sort
          )"
          docker run --rm \
            --env EXPECTED_UP_MIGRATIONS \
            --workdir /tmp \
            --entrypoint python \
            schatten-backend:${{ github.sha }} \
            -c "import importlib.util, os; from app.core.migrations import discover_migrations; migrations = discover_migrations(); assert [migration.up_name for migration in migrations] == os.environ['EXPECTED_UP_MIGRATIONS'].splitlines(); assert importlib.util.find_spec('pytest') is None; assert os.getuid() == 10001; assert os.getgid() == 10001"

      - name: Verify release migration and production API
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schatten_test
          BACKEND_IMAGE: schatten-backend:${{ github.sha }}
          APP_ENV: test
          PUBLIC_ORIGIN: http://127.0.0.1:8000
          APP_ALLOWED_ORIGIN: http://127.0.0.1:8000
        run: |
          docker run --rm --network host \
            --env DATABASE_URL \
            "$BACKEND_IMAGE" python migrate.py up
          docker run --rm --network host \
            --env DATABASE_URL \
            "$BACKEND_IMAGE" python migrate.py up

          backend_container_id="$(docker run --detach --network host \
            --env DATABASE_URL \
            --env APP_ENV \
            --env PUBLIC_ORIGIN \
            --env APP_ALLOWED_ORIGIN \
            "$BACKEND_IMAGE")"
          trap 'docker rm --force "$backend_container_id"' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done

          docker logs "$backend_container_id"
          exit 1

      - name: Verify production prediction worker image lifecycle
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schatten_test
          BACKEND_IMAGE: schatten-backend:${{ github.sha }}
        run: bash .github/scripts/verify-production-worker.sh

      - name: Verify migration failure blocks Compose backend startup
        env:
          BACKEND_IMAGE: schatten-backend:${{ github.sha }}
        run: bash .github/scripts/verify-release-compose-failure.sh

  frontend-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: frontend
        run: pnpm lint

      - name: Test frontend
        working-directory: frontend
        run: pnpm test

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Build production frontend image
        run: >-
          docker build
          --target production
          --tag schatten-frontend:${{ github.sha }}
          --file frontend/Dockerfile
          frontend

      - name: Verify production frontend security boundary
        env:
          FRONTEND_IMAGE: schatten-frontend:${{ github.sha }}
        run: bash .github/scripts/verify-production-frontend.sh
