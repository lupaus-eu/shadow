services:
  migration:
    extends:
      file: docker-compose.release.yml
      service: migration
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable release image reference}

  backend:
    extends:
      file: docker-compose.release.yml
      service: backend
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable release image reference}

  prediction-worker:
    extends:
      file: docker-compose.release.yml
      service: prediction-worker
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an immutable release image reference}

  frontend:
    extends:
      file: docker-compose.release.yml
      service: frontend
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to an immutable release image reference}
