x-backend-build: &backend-build
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: production

x-backend-runtime: &backend-runtime
  <<: *backend-build
  environment:
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for the target environment}

services:
  migration:
    <<: *backend-runtime
    command: ["python", "migrate.py", "up"]
    restart: "no"
    healthcheck:
      disable: true

  backend:
    <<: *backend-runtime
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for the target environment}
      APP_ENV: production
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:?Set the tenant-specific OIDC discovery URL}
      OIDC_ISSUER: ${OIDC_ISSUER:?Set the exact expected OIDC issuer}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set the confidential OIDC client ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set the confidential OIDC client secret}
      OIDC_SCOPES: openid profile email
      OIDC_CALLBACK_PATH: /api/v1/auth/callback
      OIDC_ALLOWED_SIGNING_ALGORITHMS: RS256
      OIDC_REQUIRE_VERIFIED_EMAIL: "false"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the exact public HTTPS origin}
      APP_ALLOWED_ORIGIN: ${PUBLIC_ORIGIN:?Set the exact public HTTPS origin}
      TRUSTED_CADDY_PEER_CIDRS: ${TRUSTED_CADDY_PEER_CIDRS:?Set the internal Caddy peer CIDRs}
      SESSION_COOKIE_SECURE: "true"
      AUTH_SESSION_IDLE_TIMEOUT_SECONDS: "1800"
      AUTH_SESSION_ABSOLUTE_LIFETIME_SECONDS: "28800"
      AUTH_SESSION_ACTIVITY_WRITE_SECONDS: "300"
      OIDC_TRANSACTION_LIFETIME_SECONDS: "600"
    depends_on:
      migration:
        condition: service_completed_successfully
        required: true
    expose:
      - "8000"

  prediction-worker:
    <<: *backend-runtime
    command: ["python", "-m", "app.api.v1.predictions.worker"]
    depends_on:
      migration:
        condition: service_completed_successfully
        required: true
    healthcheck:
      test: ["CMD", "python", "-m", "app.api.v1.predictions.worker", "health-check"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    init: true
    restart: unless-stopped
    stop_grace_period: 10s

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      target: production
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the exact public HTTPS origin}
      CADDY_TRUSTED_PROXY_CIDRS: ${CADDY_TRUSTED_PROXY_CIDRS:?Set the Coolify edge proxy CIDRs}
    depends_on:
      backend:
        condition: service_healthy
        required: true
    expose:
      - "8080"
