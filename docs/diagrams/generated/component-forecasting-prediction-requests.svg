81818;stroke-width:0.5;" width="235.79" x="336" y="409.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="154.6768" x="346" y="432.292">Organisation States +</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="215.79" x="346" y="448.5889">Twin Structure source services</text></g><g id="elem_GMN17"><path d="M607.5,415.7969 L607.5,456.0625 L1012.8696,456.0625 L1012.8696,425.7969 L1002.8696,415.7969 L607.5,415.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1002.8696,415.7969 L1002.8696,425.7969 L1012.8696,425.7969 L1002.8696,415.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="363.6763" x="613.5" y="432.8638">Current synchronous creation remains until TASK-057C.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.3696" x="613.5" y="447.9966">Accepted work never depends on browser/session lifetime.</text></g><g id="elem_GMN20"><path d="M6,752.7969 L6,808.1953 A0,0 0 0 0 6,808.1953 L389.686,808.1953 A0,0 0 0 0 389.686,808.1953 L389.686,762.7969 L379.686,752.7969 L202,752.7969 L198,693.0269 L194,752.7969 L6,752.7969 A0,0 0 0 0 6,752.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M379.686,752.7969 L379.686,762.7969 L389.686,762.7969 L379.686,752.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="300.3394" x="12" y="769.8638">No source reads, queue access or publication.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="362.686" x="12" y="784.9966">Supervisor checks cancellation/ownership each second,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.4219" x="12" y="800.1294">terminates, force-kills after two seconds, and reaps.</text></g><g id="elem_GMN23"><path d="M343.5,533.2969 L343.5,573.5625 L636.1353,573.5625 L636.1353,543.2969 L626.1353,533.2969 L343.5,533.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M626.1353,533.2969 L626.1353,543.2969 L636.1353,543.2969 L626.1353,533.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.7974" x="349.5" y="550.3638">One global calculation; no broker, retries,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.6353" x="349.5" y="565.4966">scheduler, priorities or parallel execution.</text></g><!--link User to ui--><g id="link_User_ui"><path d="M454,118.8269 C454,138.1369 454,155.1269 454,172.5469 " fill="none" id="User-to-ui" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="454,178.5469,458,169.5469,454,173.5469,450,169.5469,454,178.5469" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.395" x="303" y="144.7538">submit, inspect, cancel</text></g><!--link ui to api--><g id="link_ui_api"><path d="M454,232.0769 C454,250.0869 454,267.7369 454,285.7069 " fill="none" id="ui-to-api" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="454,291.7069,458,282.7069,454,286.7069,450,282.7069,454,291.7069" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.7485" x="458.2405" y="242.9638">HTTPS request summaries</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.2295" x="455" y="258.0966">(two-second visible polling)</text></g><!--link api to database--><g id="link_api_database"><path d="M367.33,318.7969 C293.06,318.7969 19