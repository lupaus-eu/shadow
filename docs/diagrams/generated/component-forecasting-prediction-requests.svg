<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="798px" preserveAspectRatio="none" style="width:1027px;height:798px;background:#FFFFFF;" version="1.1" viewBox="0 0 1027 798" width="1027px" zoomAndPan="magnify"><title>Schatten - Forecasting Prediction Request Architecture</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="437.9512" x="287.7092" y="22.9951">Schatten - Forecasting Prediction Request Architecture</text><!--entity User--><g id="elem_User"><ellipse cx="461.4551" cy="51.2969" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M461.4551,59.2969 L461.4551,86.2969 M448.4551,67.2969 L474.4551,67.2969 M461.4551,86.2969 L448.4551,101.2969 M461.4551,86.2969 L474.4551,101.2969 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="31.9102" x="445.5" y="115.792">User</text></g><!--entity ui--><g id="elem_ui"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="124.8018" x="399" y="178.7969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="104.8018" x="409" y="201.792">Predictions tab</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="89.6738" x="409" y="218.0889">(TASK-057D)</text></g><!--entity api--><g id="elem_api"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="173.1592" x="375" y="291.7969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="153.1592" x="385" y="314.792">FastAPI prediction API</text></g><!--entity database--><g id="elem_database"><path d="M102.5,397.7969 C102.5,387.7969 205.5645,387.7969 205.5645,387.7969 C205.5645,387.7969 308.6289,387.7969 308.6289,397.7969 L308.6289,439.3906 C308.6289,449.3906 205.5645,449.3906 205.5645,449.3906 C205.5645,449.3906 102.5,449.3906 102.5,439.3906 L102.5,397.7969 " fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M102.5,397.7969 C102.5,407.7969 205.5645,407.7969 205.5645,407.7969 C205.5645,407.7969 308.6289,407.7969 308.6289,397.7969 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.7529" x="112.5" y="424.792">PostgreSQL</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="186.1289" x="112.5" y="441.0889">requests + saved versions</text></g><!--entity worker--><g id="elem_worker"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="264.9043" x="73" y="509.7969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="200.4639" x="83" y="532.792">Prediction worker supervisor</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="244.9043" x="83" y="549.0889">(local + release Compose runtime)</text></g><!--entity child--><g id="elem_child"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="133.709" x="138.5" y="622.7969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="109.3477" x="148.5" y="645.792">One supervised</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="113.709" x="148.5" y="662.0889">calculation child</text></g><!--entity sources--><g id="elem_sources"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="235.79" x="343.5" y="392.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="154.6768" x="353.5" y="415.292">Organisation States +</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="215.79" x="353.5" y="431.5889">Twin Structure source services</text></g><g id="elem_GMN17"><path d="M615,398.7969 L615,439.0625 L1020.3696,439.0625 L1020.3696,408.7969 L1010.3696,398.7969 L615,398.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1010.3696,398.7969 L1010.3696,408.7969 L1020.3696,408.7969 L1010.3696,398.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="338.1143" x="621" y="415.8638">Submission commits the frozen request before 202.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.3696" x="621" y="430.9966">Accepted work never depends on browser/session lifetime.</text></g><g id="elem_GMN20"><path d="M13.5,735.7969 L13.5,791.1953 A0,0 0 0 0 13.5,791.1953 L397.186,791.1953 A0,0 0 0 0 397.186,791.1953 L397.186,745.7969 L387.186,735.7969 L209.5,735.7969 L205.5,676.0269 L201.5,735.7969 L13.5,735.7969 A0,0 0 0 0 13.5,735.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M387.186,735.7969 L387.186,745.7969 L397.186,745.7969 L387.186,735.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="300.3394" x="19.5" y="752.8638">No source reads, queue access or publication.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="362.686" x="19.5" y="767.9966">Supervisor checks cancellation/ownership each second,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.4219" x="19.5" y="783.1294">terminates, force-kills after two seconds, and reaps.</text></g><g id="elem_GMN23"><path d="M373,516.2969 L373,556.5625 L665.6353,556.5625 L665.6353,526.2969 L655.6353,516.2969 L373,516.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M655.6353,516.2969 L655.6353,526.2969 L665.6353,526.2969 L655.6353,516.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.7974" x="379" y="533.3638">One global calculation; no broker, retries,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.6353" x="379" y="548.4966">scheduler, priorities or parallel execution.</text></g><g id="elem_GMN26"><path d="M308,629.2969 L308,669.5625 A0,0 0 0 0 308,669.5625 L774.5166,669.5625 A0,0 0 0 0 774.5166,669.5625 L774.5166,639.2969 L764.5166,629.2969 L327,629.2969 L323,563.0769 L319,629.2969 L308,629.2969 A0,0 0 0 0 308,629.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M764.5166,629.2969 L764.5166,639.2969 L774.5166,639.2969 L764.5166,629.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="412.7881" x="314" y="646.3638">Same backend image as API/migration; database-only settings.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="445.5166" x="314" y="661.4966">Dedicated health check, automatic restart, init and shutdown grace.</text></g><!--link User to ui--><g id="link_User_ui"><path d="M461.5,118.8269 C461.5,138.1369 461.5,155.1269 461.5,172.5469 " fill="none" id="User-to-ui" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="461.5,178.5469,465.5,169.5469,461.5,173.5469,457.5,169.5469,461.5,178.5469" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.395" x="310.5" y="144.7538">submit, inspect, cancel</text></g><!--link ui to api--><g id="link_ui_api"><path d="M461.5,231.9369 C461.5,250.6869 461.5,269.2669 461.5,285.7569 " fill="none" id="ui-to-api" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="461.5,291.7569,465.5,282.7569,461.5,286.7569,457.5,282.7569,461.5,291.7569" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.7485" x="465.7405" y="242.9138">HTTPS request summaries</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.2295" x="462.5" y="258.0466">(two-second visible polling)</text></g><!--link api to database--><g id="link_api_database"><path d="M374.83,309.7969 C300.56,309.7969 205.5,309.7969 205.5,309.7969 C205.5,309.7969 205.5,349.3569 205.5,381.5569 " fill="none" id="api-to-database" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="205.5,387.5569,209.5,378.5569,205.5,382.5569,201.5,378.5569,205.5,387.5569" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.021" x="76.28" y="290.8638">freeze snapshot; enqueue;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.73" x="84.9255" y="305.9966">request/list/cancel state</text></g><!--link database to worker--><g id="link_database_worker"><path d="M154,449.9769 C154,468.6069 154,486.0169 154,503.7569 " fill="none" id="database-to-worker" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="154,509.7569,158,500.7569,154,504.7569,150,500.7569,154,509.7569" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.6689" x="7" y="460.9338">FIFO claim guarded by</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.6616" x="37.5037" y="476.0666">advisory lock</text></g><!--link worker to database--><g id="link_worker_database"><path d="M205.5,509.6369 C205.5,491.8969 205.5,474.5269 205.5,455.9269 " fill="none" id="worker-to-database" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="205.5,449.9269,201.5,458.9269,205.5,454.9269,209.5,458.9269,205.5,449.9269" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.3008" x="206.5" y="460.8538">atomic version publication</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="134.6274" x="225.3367" y="475.9866">and completed state</text></g><!--link worker to child--><g id="link_worker_child"><path d="M183.17,563.0769 C183.17,581.0869 183.17,598.7369 183.17,616.7069 " fill="none" id="worker-to-child" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="183.17,622.7069,187.17,613.7069,183.17,617.7069,179.17,613.7069,183.17,622.7069" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="124.376" x="58.17" y="588.9638">detached snapshot</text></g><!--link child to worker--><g id="link_child_worker"><path d="M227.83,622.5169 C227.83,604.5069 227.83,586.8569 227.83,568.8869 " fill="none" id="child-to-worker" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="227.83,562.8869,223.83,571.8869,227.83,567.8869,231.83,571.8869,227.83,562.8869" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173.7734" x="228.83" y="588.7638">detached complete results</text></g><!--link api to sources--><g id="link_api_sources"><path d="M461.5,328.2869 C461.5,345.7769 461.5,366.2269 461.5,386.0269 " fill="none" id="api-to-sources" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="461.5,392.0269,465.5,383.0269,461.5,387.0269,457.5,383.0269,461.5