<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="798px" preserveAspectRatio="none" style="width:1019px;height:798px;background:#FFFFFF;" version="1.1" viewBox="0 0 1019 798" width="1019px" zoomAndPan="magnify"><title>Schatten - Forecasting Prediction Request Architecture</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="437.9512" x="283.9592" y="22.9951">Schatten - Forecasting Prediction Request Architecture</text><!--entity User--><g id="elem_User"><ellipse cx="453.9551" cy="51.2969" fill="#F1F1F1" rx="8" ry="8" style="stroke:#181818;stroke-width:0.5;"/><path d="M453.9551,59.2969 L453.9551,86.2969 M440.9551,67.2969 L466.9551,67.2969 M453.9551,86.2969 L440.9551,101.2969 M453.9551,86.2969 L466.9551,101.2969 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="31.9102" x="438" y="115.792">User</text></g><!--entity ui--><g id="elem_ui"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="124.8018" x="391.5" y="178.7969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="104.8018" x="401.5" y="201.792">Predictions tab</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="89.6738" x="401.5" y="218.0889">(TASK-057D)</text></g><!--entity api--><g id="elem_api"><rect fill="#F1F1F1" height="36.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="173.1592" x="367.5" y="291.7969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="153.1592" x="377.5" y="314.792">FastAPI prediction API</text></g><!--entity database--><g id="elem_database"><path d="M95,397.7969 C95,387.7969 198.0645,387.7969 198.0645,387.7969 C198.0645,387.7969 301.1289,387.7969 301.1289,397.7969 L301.1289,439.3906 C301.1289,449.3906 198.0645,449.3906 198.0645,449.3906 C198.0645,449.3906 95,449.3906 95,439.3906 L95,397.7969 " fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><path d="M95,397.7969 C95,407.7969 198.0645,407.7969 198.0645,407.7969 C198.0645,407.7969 301.1289,407.7969 301.1289,397.7969 " fill="none" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.7529" x="105" y="424.792">PostgreSQL</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="186.1289" x="105" y="441.0889">requests + saved versions</text></g><!--entity worker--><g id="elem_worker"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="220.4639" x="88" y="509.7969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="200.4639" x="98" y="532.792">Prediction worker supervisor</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="199.2334" x="98" y="549.0889">(runtime wiring: TASK-057E)</text></g><!--entity child--><g id="elem_child"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="133.709" x="131" y="622.7969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="109.3477" x="141" y="645.792">One supervised</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="113.709" x="141" y="662.0889">calculation child</text></g><!--entity sources--><g id="elem_sources"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="235.79" x="336" y="392.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="154.6768" x="346" y="415.292">Organisation States +</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="215.79" x="346" y="431.5889">Twin Structure source services</text></g><g id="elem_GMN17"><path d="M607.5,398.7969 L607.5,439.0625 L1012.8696,439.0625 L1012.8696,408.7969 L1002.8696,398.7969 L607.5,398.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1002.8696,398.7969 L1002.8696,408.7969 L1012.8696,408.7969 L1002.8696,398.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="338.1143" x="613.5" y="415.8638">Submission commits the frozen request before 202.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="384.3696" x="613.5" y="430.9966">Accepted work never depends on browser/session lifetime.</text></g><g id="elem_GMN20"><path d="M6,735.7969 L6,791.1953 A0,0 0 0 0 6,791.1953 L389.686,791.1953 A0,0 0 0 0 389.686,791.1953 L389.686,745.7969 L379.686,735.7969 L202,735.7969 L198,676.0269 L194,735.7969 L6,735.7969 A0,0 0 0 0 6,735.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M379.686,735.7969 L379.686,745.7969 L389.686,745.7969 L379.686,735.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="300.3394" x="12" y="752.8638">No source reads, queue access or publication.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="362.686" x="12" y="767.9966">Supervisor checks cancellation/ownership each second,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.4219" x="12" y="783.1294">terminates, force-kills after two seconds, and reaps.</text></g><g id="elem_GMN23"><path d="M343.5,516.2969 L343.5,556.5625 L636.1353,556.5625 L636.1353,526.2969 L626.1353,516.2969 L343.5,516.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M626.1353,516.2969 L626.1353,526.2969 L636.1353,526.2969 L626.1353,516.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270.7974" x="349.5" y="533.3638">One global calculation; no broker, retries,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="271.6353" x="349.5" y="548.4966">scheduler, priorities or parallel execution.</text></g><!--link User to ui--><g id="link_User_ui"><path d="M454,118.8269 C454,138.1369 454,155.1269 454,172.5469 " fill="none" id="User-to-ui" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="454,178.5469,458,169.5469,454,173.5469,450,169.5469,454,178.5469" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="150.395" x="303" y="144.7538">submit, inspect, cancel</text></g><!--link ui to api--><g id="link_ui_api"><path d="M454,231.9369 C454,250.6869 454,269.2669 454,285.7569 " fill="none" id="ui-to-api" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="454,291.7569,458,282.7569,454,286.7569,450,282.7569,454,291.7569" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.7485" x="458.2405" y="242.9138">HTTPS request summaries</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.2295" x="455" y="258.0466">(two-second visible polling)</text></g><!--link api to database--><g id="link_api_database"><path d="M367.33,309.7969 C293.06,309.7969 198,309.7969 198,309.7969 C198,309.7969 198,349.3569 198,381.5569 " fill="none" id="api-to-database" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="198,387.5569,202,378.5569,198,382.5569,194,378.5569,198,387.5569" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.021" x="68.78" y="290.8638">freeze snapshot; enqueue;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156.73" x="77.4255" y="305.9966">request/list/cancel state</text></g><!--link database to worker--><g id="link_database_worker"><path d="M163.67,449.9769 C163.67,468.6069 163.67,486.0169 163.67,503.7569 " fill="none" id="database-to-worker" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="163.67,509.7569,167.67,500.7569,163.67,504.7569,159.67,500.7569,163.67,509.7569" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146.6689" x="16.67" y="460.9338">FIFO claim guarded by</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.6616" x="47.1737" y="476.0666">advisory lock</text></g><!--link worker to database--><g id="link_worker_database"><path d="M232.33,509.6369 C232.33,491.8969 232.33,474.5269 232.33,455.9269 " fill="none" id="worker-to-database" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="232.33,449.9269,228.33,458.9269,232.33,454.9269,236.33,458.9269,232.33,449.9269" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.3008" x="233.33" y="460.8538">atomic version publication</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="134.6274" x="252.1667" y="475.9866">and completed state</text></g><!--link worker to child--><g id="link_worker_child"><path d="M175.67,563.0769 C175.67,581.0869 175.67,598.7369 175.67,616.7069 " fill="none" id="worker-to-child" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="1