<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="616px" preserveAspectRatio="none" style="width:1032px;height:616px;background:#FFFFFF;" version="1.1" viewBox="0 0 1032 616" width="1032px" zoomAndPan="magnify"><title>Schatten - AI Change Set Lifecycle (ADR-015)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="357.5742" x="330.6257" y="22.9951">Schatten - AI Change Set Lifecycle (ADR-015)</text><ellipse cx="630" cy="53.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="605" y="148.7969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="33.6396" x="613.1802" y="173.6436">draft</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="81.0596" x="378.5" y="297.7969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="71.0596" x="383.5" y="322.6436">submitted</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="78.4893" x="755" y="297.7969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68.4893" x="760" y="322.6436">discarded</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="61.6318" x="113" y="453.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="51.6318" x="118" y="478.1436">applied</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="67.5586" x="385" y="453.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="57.5586" x="390" y="478.1436">rejected</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="641" y="453.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="38.7871" x="646.6064" y="478.1436">failed</text><g id="elem_GMN2"><path d="M306,141.2969 L306,196.6953 A0,0 0 0 0 306,196.6953 L570.0708,196.6953 A0,0 0 0 0 570.0708,196.6953 L570.0708,172.7969 L604.85,168.7969 L570.0708,164.7969 L570.0708,151.2969 L560.0708,141.2969 L306,141.2969 A0,0 0 0 0 306,141.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M560.0708,141.2969 L560.0708,151.2969 L570.0708,151.2969 L560.0708,141.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.0708" x="312" y="158.3638">Only the creator's grants edit a draft.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.7437" x="312" y="173.4966">Dry-run stops at the first failing</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.3774" x="312" y="188.6294">operation: ok, error, then not_run.</text></g><g id="elem_GMN5"><path d="M28,290.2969 L28,345.6953 A0,0 0 0 0 28,345.6953 L344.4834,345.6953 A0,0 0 0 0 344.4834,345.6953 L344.4834,321.7969 L378.48,317.7969 L344.4834,313.7969 L344.4834,300.2969 L334.4834,290.2969 L28,290.2969 A0,0 0 0 0 28,290.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M334.4834,290.2969 L334.4834,300.2969 L344.4834,300.2969 L334.4834,290.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="277.5449" x="34" y="307.3638">Immutable. No MCP tool applies or rejects.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295.4834" x="34" y="322.4966">Replacement flags and the review fingerprint</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245.5146" x="34" y="337.6294">are recomputed against current data.</text></g><g id="elem_GMN8"><path d="M6,554.2969 L6,609.6953 A0,0 0 0 0 6,609.6953 L281.9092,609.6953 A0,0 0 0 0 281.9092,609.6953 L281.9092,564.2969 L271.9092,554.2969 L148,554.2969 L144,493.3369 L140,554.2969 L6,554.2969 A0,0 0 0 0 6,554.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M271.9092,554.2969 L271.9092,564.2969 L281.9092,564.2969 L271.9092,554.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.9092" x="12" y="571.3638">Business rows written only through the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="237.1484" x="12" y="586.4966">domains' *_in_transaction cores; the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="147.3354" x="12" y="601.6294">reviewer is their actor.</text></g><g id="elem_GMN11"><path d="M556.5,554.2969 L556.5,609.6953 A0,0 0 0 0 556.5,609.6953 L855.686,609.6953 A0,0 0 0 0 855.686,609.6953 L855.686,564.2969 L845.686,554.2969 L699.91,554.2969 L673.15,493.3369 L691.91,554.2969 L556.5,554.2969 A0,0 0 0 0 556.5,554.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M845.686,554.2969 L845.686,564.2969 L855.686,564.2969 L845.686,554.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.186" x="562.5" y="571.3638">Everything rolled back, then marked failed</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.2139" x="562.5" y="586.4966">in a new transaction only while still</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.9575" x="562.5" y="601.6294">submitted. Not retried; stage a new one.</text></g><g id="elem_GMN14"><path d="M317,561.7969 L317,602.0625 A0,0 0 0 0 317,602.0625 L520.5269,602.0625 A0,0 0 0 0 520.5269,602.0625 L520.5269,571.7969 L510.5269,561.7969 L423,561.7969 L419,493.3369 L415,561.7969 L317,561.7969 A0,0 0 0 0 317,561.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M510.5269,561.7969 L510.5269,571.7969 L520.5269,571.7969 L510.5269,561.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.5269" x="323" y="578.8638">applied, rejected, failed and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="151.8359" x="323" y="593.9966">discarded are terminal.</text></g><!--link *start* to draft--><g id="link_*start*_draft"><path d="M630,63.5869 C630,82.1169 630,118.0069 630,142.6669 " fill="none" id="*start*-to-draft" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="630,148.6669,634,139.6669,630,143.6669,626,139.6669,630,148.6669" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.6514" x="631" y="106.3638">create_change_set (MCP, write grant)</text></g><!--link draft to draft--><g id="link_draft_draft"><path d="M655.28,157.6269 C672.77,154.2469 690,157.9669 690,168.7969 C690,179.6269 678.661,184.4853 661.171,181.1053 " fill="none" id="draft-to-draft" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="655.28,179.9669,663.3575,185.6019,660.1892,180.9156,664.8755,177.7472,655.28,179.9669" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.3721" x="742.2268" y="158.3638">add_operations / remove_operation</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.0332" x="750.3962" y="173.4966">(scenario reference recomputed)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323.8257" x="696" y="188.6294">validate_change_set (dry-run, always rolled back)</text></g><!--link draft to submitted--><g id="link_draft_submitted"><path d="M604.84,187.8069 C599.16,191.3169 593.02,194.7069 587,197.2969 C536.1,219.1769 509.6,193.1069 466,227.2969 C443.21,245.1669 432.0477,271.4532 425.7277,291.9532 " fill="none" id="draft-to-submitted" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="423.96,297.6869,430.434,290.2648,425.433,292.9088,422.789,287.9079,423.96,297.6869" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="240.2334" x="467" y="240.3638">submit_change_set (creator's grant):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.9263" x="468.6536" y="255.4966">re-validate, freeze generated values</text></g><!--link draft to discarded--><g id="link_draft_discarded"><path d="M655.34,184.2869 C673.17,195.0469 697.12,210.6869 716,227.2969 C740.76,249.0869 761.3738,273.8472 776.0938,292.9172 " fill="none" id="draft-to-discarded" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="779.76,297.6669,777.4271,288.0983,776.7048,293.7089,771.0943,292.9866,779.76,297.6669" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="238.564" x="747" y="247.8638">discard_change_set (creator's grant)</text></g><!--link submitted to applied--><g id="link_submitted_applied"><path d="M382.81,337.8669 C375.72,341.0469 368.24,344.0469 361,346.2969 C281.47,371.0569 239.44,322.3269 176,376.2969 C153.39,395.5369 147.2063,425.23 145.2663,447.26 " fill="none" id="submitted-to-applied" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="144.74,453.2369,149.5141,444.6225,145.1786,448.2562,141.5449,443.9207,144.74,453.2369" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.7876" x="210.0618" y="389.3638">human apply in Schatten:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.9111" x="177" y="404.4966">lock, status, fingerprint, re-validate,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.0439" x="221.4336" y="419.6294">execute, commit once</text></g><!--link submitted to rejected--><g id="link_submitted_rejected"><path d="M419,337.9269 C419,367.3469 419,417.3669 419,446.9269 " fill="none" id="submitted-to-rejected" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="419,452.9269,423,443.9269,419,447.9269,415,443.9269,419,452.9269" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.8296" x="420" y="404.3638">human reject in Schatten</text></g><!--link submitted to failed--><g id="link_submitted_failed"><path d="M459.78,325.1369 C497.18,332.5169 552.73,347.5569 593,376.2969 C621.46,396.6069 640.9162,426.043 653.0462,447.683 " fill="none" id="submitted-to-failed" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="655.98,452.9169,655.0686,443.1103,653.5352,448.5553,648.0901,447.022,655.98,452.9169" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.0317" x="637" y="389.3638">re-validation, operation or commit failure,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245.1274" x="650.9521" y="404.4966">or a lock or statement timeout during</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.5781" x="689.7268" y="419.6294">re-validation or execution</text></g><!--link submitted to submitted--><g id="link_submitted_submitted"><path d="M459.78,304.1669 C478.35,302.7769 494.5,307.3169 494.5,317.7969 C494.5,328.2769 484.3333,333.2647 465.7633,331.8747 " fill="none" id="submitted-to-submitted" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="459.78,331.4269,468.4563,336.0875,464.7661,331.8001,469.0535,328.1098,459.78,331.4269" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.8198" x="500.5" y="307.3638">apply rejected in the lock, status or</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="195.3809" x="518.2195" y="322.4966">fingerprint step (review_stale,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.9053" x="506.4573" y="337.6294">apply_in_progress, retryable 503)</text></g><!--SRC=[VLHDRzim3BtxL_2sj72w3aClBJ2WQtSei2zqnsK869cEjSgIGSd9iby_qd9SDmDwiocIx_4zIiacH_33D9WIULZ2xGFSDUYt4gG4dsrDvc0aPN5x_xYyV7TrLXIDhGYexT81Aeg6RPTiy4Nny_mNB9SVe6Ai4ro3OS94QpEqMqTfj_Xozxs4FTj4i6NqwQp8oVCohAfrw8XHkqPu2qnjsD5pREKNqP17ja7EQcBoXkJBXBRh4rLdAxz3PwjJy8eFI-vz2UZsU8Z0mJcgO8FcQSuZzflMYXgLSCdVBxeCKmL-4yS9hbUUQNa4BA5cehyo7dcbArtagASu7zH6WrmD0EFtgmZ5CoCjnwvpTYXk-XRzy7y0woSNXP4Bvgc4c33rKIXPwSqTMvzAc9DTUVf3fbVQ8fvWG10fJ_2OVfD9Cy0Sc2EULDHetP3_Z2MsbJ0v286FW9hRirAH688IrrEbJYtv1Ccs5Fe4LI_yjtEnnqPv1Dt0bopcFcQDfac4Uce8vYf9fvMV2ILXwc31jBEqNqkEKuv3dxNrwux3bYb6rJFn0JToHQuktyljy46Msv5u7UgyqmN0Do_m2ddYRGIgH0JCYHUIUP-NLE135m7JK5LRZbag8IX9av3N46G2OWvSQgO7WLzB_KL1lj8VEc4qgI9j7jgsJqhz0hu6aBi9AGGtBfWgCYeMbTWZTGvDzgHsk1LoWg3iiaRpBPDqvFcL1DoYzJA3wPcrWzY7_t7SX9H2gop77PS-7_jelGWjjtKVXwT3twcGzUJGRnlb88bLQ1NY3PohFqdKZMY67J51dBePqp9POh1H8rQMpeWXht39