0.9951">Authentik: local</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="166.9746" x="871.1621" y="107.292">Entra: production direct</text><rect fill="#E2E2F0" height="62.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="194.291" x="857.5039" y="824.1797"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="180.291" x="864.5039" y="844.1748">Configured OIDC provider</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="109.5732" x="899.8628" y="860.4717">Authentik: local</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="166.9746" x="871.1621" y="876.7686">Entra: production direct</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.7529" x="1061.7949" y="115.292">PostgreSQL</text><path d="M1087.1714,66.2969 C1087.1714,56.2969 1105.1714,56.2969 1105.1714,56.2969 C1105.1714,56.2969 1123.1714,56.2969 1123.1714,66.2969 L1123.1714,92.2969 C1123.1714,102.2969 1105.1714,102.2969 1105.1714,102.2969 C1105.1714,102.2969 1087.1714,102.2969 1087.1714,92.2969 L1087.1714,66.2969 " fill="#E2E2F0" style="stroke:#181818;stroke-width:1.5;"/><path d="M1087.1714,66.2969 C1087.1714,76.2969 1105.1714,76.2969 1105.1714,76.2969 C1105.1714,76.2969 1123.1714,76.2969 1123.1714,66.2969 " fill="none" style="stroke:#181818;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.7529" x="1061.7949" y="837.1748">PostgreSQL</text><path d="M1087.1714,850.4766 C1087.1714,840.4766 1105.1714,840.4766 1105.1714,840.4766 C1105.1714,840.4766 1123.1714,840.4766 1123.1714,850.4766 L1123.1714,876.4766 C1123.1714,886.4766 1105.1714,886.4766 1105.1714,886.4766 C1105.1714,886.4766 1087.1714,886.4766 1087.1714,876.4766 L1087.1714,850.4766 " fill="#E2E2F0" style="stroke:#181818;stroke-width:1.5;"/><path d="M1087.1714,850.4766 C1087.1714,860.4766 1105.1714,860.4766 1105.1714,860.4766 C1105.1714,860.4766 1123.1714,860.4766 1123.1714,850.4766 " fill="none" style="stroke:#181818;stroke-width:1.5;"/><path d="M734,133.5938 L734,203.5938 L1174,203.5938 L1174,143.5938 L1164,133.5938 L734,133.5938 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1164,133.5938 L1164,143.5938 L1174,143.5938 L1164,133.5938 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="385.417" x="740" y="150.6606">Local Authentik is exposed through its loopback TLS Caddy</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="419.5547" x="740" y="165.7935">and may federate to Entra through a separate local registration.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="392.8501" x="740" y="180.9263">That upstream hop does not replace the limited direct-Entra</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="335.1816" x="740" y="196.0591">production smoke or validate the Coolify boundary.</text><polygon fill="#181818" points="344.9868,226.2578,354.9868,230.2578,344.9868,234.2578,348.9868,230.2578" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="36.5195" x2="350.9868" y1="230.2578" y2="230.2578"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="296.4673" x="43.5195" y="225.1919">GET /api/v1/auth/login?return_to=/workspace</text><polygon fill="#181818" points="611.8989,255.3906,621.8989,259.3906,611.8989,263.3906,615.8989,259.3906" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="356.9868" x2="617.8989" y1="259.3906" y2="259.3906"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.9121" x="363.9868" y="254.3247">Fixed Host/proto and trusted client IP</text><polygon fill="#181818" points="1093.1714,284.5234,1103.1714,288.5234,1093.1714,292.5234,1097.1714,288.5234" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="623.8989" x2="1099.1714" y1="288.5234" y2="288.5234"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="337.1177" x="630.8989" y="283.4575">Store hashed state + browser binding, nonce, PKCE</text><polygon fill="#181818" points="47.5195,328.7891,37.5195,332.7891,47.5195,336.7891,43.5195,332.7891" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="41.5195" x2="622.8989" y1="332.7891" y2="332.7891"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.5947" x="53.5195" y="312.5903">302 provider authorization URL</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.2837" x="53.5195" y="327.7231">HttpOnly pre-auth cookie</text><polygon fill="#181818" points="942.6494,357.9219,952.6494,361.9219,942.6494,365.9219,946.6494,361.9219" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="36.5195" x2="948.6494" y1="361.9219" y2="361.9219"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.0972" x="43.5195" y="356.856">Authorization Code + PKCE login</text><polygon fill="#181818" points="47.5195,387.0547,37.5195,391.0547,47.5195,395.0547,43.5195,391.0547" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="41.5195" x2="953.6494" y1="391.0547" y2="391.0547"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173.7671" x="53.5195" y="385.9888">Redirect with code + state</text><polygon fill="#181818" points="344.9868,416.1875,354.9868,420.1875,344.9868,424.1875,348.9868,420.1875" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="36.5195" x2="350.9868" y1="420.1875" y2="420.1875"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="294.3472" x="43.5195" y="415.1216">GET /api/v1/auth/callback?code=...&amp;state=...</text><path d="M361,433.1875 L361,488.1875 L603,488.1875 L603,443.1875 L593,433.1875 L361,433.1875 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M593,433.1875 L593,443.1875 L603,443.1875 L593,433.1875 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.7173" x="367" y="450.2544">Access log replaces code, state,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.8887" x="367" y="465.3872">error and error_description values</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="107.2373" x="367" y="480.52">with REDACTED.</text><polygon fill="#181818" points="611.8989,510.7188,621.8989,514.7188,611.8989,518.7188,615.8989,514.7188" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="356.9868" x2="617.8989" y1="514.7188" y2="514.7188"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220.9111" x="363.9868" y="509.6528">Callback with fixed proxy headers</text><polygon fill="#181818" points="1093.1714,539.8516,1103.1714,543.8516,1093.1714,547.8516,1097.1714,543.8516" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="623.8989" x2="1099.1714" y1="543.8516" y2="543.8516"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.0225" x="630.8989" y="538.7856">Atomically consume browser-bound transaction</text><polygon fill="#181818" points="942.6494,568.9844,952.6494,572.9844,942.6494,576.9844,946.6494,572.9844" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="623.8989" x2="948.6494" y1="572.9844" y2="572.9844"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="306.7505" x="630.8989" y="567.9185">Redeem code with confidential client + verifier</text><polygon fill="#181818" points="634.8989,598.1172,624.8989,602.1172,634.8989,606.1172,630.8989,602.1172" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="628.8989" x2="953.6494" y1="602.1172" y2="602.1172"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.2876" x="640.8989" y="597.0513">Validated identity claims</text><polygon fill="#181818" points="1093.1714,642.3828,1103.1714,646.3828,1093.1714,650.3828,1097.1714,646.3828" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="623.8989" x2="1099.1714" y1="646.3828" y2="646.3828"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="235.3901" x="630.8989" y="626.1841">Resolve permanent (issuer, subject)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="275.9707" x="630.8989" y="641.3169">Create hashed opaque application session</text><polygon fill="#181818" points="47.5195,686.6484,37.5195,690.6484,47.5195,694.6484,43.5195,690.6484" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="41.5195" x2="622.8989" y1="690.6484" y2="690.6484"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.0186" x="53.5195" y="670.4497">303 clean local path</text><text fill="#000000" font-family="sans-serif" font-size="13" le