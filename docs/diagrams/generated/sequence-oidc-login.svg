14" lengthAdjust="spacing" textLength="196.916" x="992.5854" y="107.292">Direct in both environments</text><rect fill="#E2E2F0" height="46.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="210.916" x="985.5854" y="1027.375"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="125.6172" x="1028.2349" y="1047.3701">Microsoft Entra ID</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="196.916" x="992.5854" y="1063.667">Direct in both environments</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.7529" x="1206.5015" y="115.292">PostgreSQL</text><path d="M1231.8779,66.2969 C1231.8779,56.2969 1249.8779,56.2969 1249.8779,56.2969 C1249.8779,56.2969 1267.8779,56.2969 1267.8779,66.2969 L1267.8779,92.2969 C1267.8779,102.2969 1249.8779,102.2969 1249.8779,102.2969 C1249.8779,102.2969 1231.8779,102.2969 1231.8779,92.2969 L1231.8779,66.2969 " fill="#E2E2F0" style="stroke:#181818;stroke-width:1.5;"/><path d="M1231.8779,66.2969 C1231.8779,76.2969 1249.8779,76.2969 1249.8779,76.2969 C1249.8779,76.2969 1267.8779,76.2969 1267.8779,66.2969 " fill="none" style="stroke:#181818;stroke-width:1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="80.7529" x="1206.5015" y="1040.3701">PostgreSQL</text><path d="M1231.8779,1053.6719 C1231.8779,1043.6719 1249.8779,1043.6719 1249.8779,1043.6719 C1249.8779,1043.6719 1267.8779,1043.6719 1267.8779,1053.6719 L1267.8779,1079.6719 C1267.8779,1089.6719 1249.8779,1089.6719 1249.8779,1089.6719 C1249.8779,1089.6719 1231.8779,1089.6719 1231.8779,1079.6719 L1231.8779,1053.6719 " fill="#E2E2F0" style="stroke:#181818;stroke-width:1.5;"/><path d="M1231.8779,1053.6719 C1231.8779,1063.6719 1249.8779,1063.6719 1249.8779,1063.6719 C1249.8779,1063.6719 1267.8779,1063.6719 1267.8779,1053.6719 " fill="none" style="stroke:#181818;stroke-width:1.5;"/><path d="M826,133.5938 L826,203.5938 L1355,203.5938 L1355,143.5938 L1345,133.5938 L826,133.5938 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1345,133.5938 L1345,143.5938 L1355,143.5938 L1345,133.5938 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="508.5425" x="832" y="150.6606">One shared single-tenant confidential registration; separate dev/prod secrets.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="370.1318" x="832" y="165.7935">Exact tenant issuer; openid profile email; no Graph calls.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="478.1436" x="832" y="180.9263">No email_verified claim requirement; missing email prevents first linking.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="482.4727" x="832" y="196.0591">Registration permissions, consent, assignments and callbacks are shared.</text><path d="M5,214.125 L5,299.125 L503,299.125 L503,224.125 L493,214.125 L5,214.125 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M493,214.125 L493,224.125 L503,224.125 L493,214.125 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="453.5146" x="11" y="231.1919">Development: https://app.localhost -&gt; local Caddy -&gt; HTTP API / Vite.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="477.6484" x="11" y="246.3247">Production: https://schatten.lupaus.eu -&gt; Caddy TLS / React -&gt; HTTP API.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="418.1899" x="11" y="261.4575">Entra Web callback is /api/v1/auth/callback at each exact origin.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="428.8223" x="11" y="276.5903">Post-logout return is /login at each origin; no Authentik or Traefik.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="400.7847" x="11" y="291.7231">Current local Authentik and release adapter remain until B/G.</text><polygon fill="#181818" points="401.9868,321.9219,411.9868,325.9219,401.9868,329.9219,405.9868,325.9219" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="93.5195" x2="407.9868" y1="325.9219" y2="325.9219"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="296.4673" x="100.5195" y="320.856">GET /api/v1/auth/login?return_to=/workspace</text><polygon fill="#181818" points="668.8989,351.0547,678.8989,355.0547,668.8989,359.0547,672.8989,355.0547" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="413.9868" x2="674.8989" y1="355.0547" y2="355.0547"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.9121" x="420.9868" y="349.9888">Fixed Host/proto and trusted client IP</text><polygon fill="#181818" points="1237.8779,380.1875,1247.8779,384.1875,1237.8779,388.1875,1241.8779,384.1875" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="680.8989" x2="1243.8779" y1="384.1875" y2="384.1875"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="337.1177" x="687.8989" y="379.1216">Store hashed state + browser binding, nonce, PKCE</text><polygon fill="#181818" points="104.5195,424.4531,94.5195,428.4531,104.5195,432.4531,100.5195,428.4531" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="98.5195" x2="679.8989" y1="428.4531" y2="428.4531"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.5947" x="110.5195" y="408.2544">302 provider authorization URL</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.2837" x="110.5195" y="423.3872">HttpOnly pre-auth cookie</text><polygon fill="#181818" points="1079.0435,453.5859,1089.0435,457.5859,1079.0435,461.5859,1083.0435,457.5859" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="93.5195" x2="1085.0435" y1="457.5859" y2="457.5859"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="213.0972" x="100.5195" y="452.52">Authorization Code + PKCE login</text><polygon fill="#181818" points="104.5195,482.7188,94.5195,486.7188,104.5195,490.7188,100.5195,486.7188" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="98.5195" x2="1090.0435" y1="486.7188" y2="486.7188"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173.7671" x="110.5195" y="481.6528">Redirect with code + state</text><polygon fill="#181818" points="401.9868,511.8516,411.9868,515.8516,401.9868,519.8516,405.9868,515.8516" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="93.5195" x2="407.9868" y1="515.8516" y2="515.8516"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="294.3472" x="100.5195" y="510.7856">GET /api/v1/auth/callback?code=...&amp;state=...</text><path d="M418,528.8516 L418,583.8516 L660,583.8516 L660,538.8516 L650,528.8516 L418,528.8516 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M650,528.8516 L650,538.8516 L660,538.8516 L650,528.8516 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="208.7173" x="424" y="545.9185">Access log replaces code, state,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.8887" x="424" y="561.0513">error and error_description values</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="107.2373" x="424" y="576.1841">with REDACTED.</text><polygon fill="#181818" points="668.8989,606.3828,678.8989,610.3828,668.8989,614.3828,672.8989,610.3828" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="413.9868" x2="674.8989" y1="610.3828" y2="610.3828"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220.9111" x="420.9868" y="605.3169">Callback with fixed proxy headers</text><polygon fill="#181818" points="1237.8779,635.5156,1247.8779,639.5156,1237.8779,643.5156,1241.8779,639.5156" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="680.8989" x2="1243.8779" y1="639.5156" y2="639.5156"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.0225" x="687.8989" y="634.4497">Atomically consume browser-bound transaction</text><polygon fill="#181818" points="1079.0435,664.6484,1089.0435,668.6484,1079.0435,672.6484,1083.0435,668.6484" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="680.8989" x2="1085.0435" y1="668.6484" y2="668.6484"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="306.7505" x="687.8989" y="663.5825">Redeem code with confidential client + verifier</text><polygon fill="#181818" points="691.8989,693.7813,681.8989,697.7813,691.8989,701.7813,687.8989,697.7813" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="685.8989" x2="1090.0435" y1="697.7813" y2="697.7813"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="103.124" x="697.8989" y="692.7153">Token response</text><line style="stroke:#181818;stroke-width:1;" x1="680.8989" x2="722.8989" y1="726.9141" y2="726.9141"/><line style="stroke:#181818;stroke-width:1;" x1="722.8989" x2="722.8989" y1="726.9141" y2="739.9141"/><line style="stroke:#181818;stroke-width:1;" x1="681.8989" x2="722.8989" y1="739.9141" y2="739.9141"/><polygon fill="#181818" points="691.8989,735.9141,681.8989,739.9141,691.8989,743.9141,687.8989,739.9141" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="396.1445" x="687.8989" y="721.8481">Validate signature, exact issuer, audience, nonce and claims</text><path d="M1254,752.9141 L1254,807.9141 L1598,807.9141 L1598,762.9141 L1588,752.9141 L1254,752.9141 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1588,752.9141 L1588,762.9141 L1598,762.9141 L1588,752.9141 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173.8306" x="1260" y="769.981">Login never creates Users.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323.7178" x="1260" y="785.1138">Existing issuer/subject bindings are not rewritten.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="321.0708" x="1260" y="800.2466">Each environment has an independent database.</text><polygon fill="#181818" points="1237.8779,845.5781,1247.8779,849.5781,1237.8779,853.5781,1241.8779,849.5781" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="680.8989" x2="1243.8779" y1="849.5781" y2="849.5781"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="440.3877" x="687.8989" y="829.3794">Guarded first-link to pre-provisioned User, or exact (issuer, subject)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="275.9707" x="687.8989" y="844.5122">Create hashed opaque application session</text><polygon fill="#181818" points="104.5195,889.8438,94.5195,893.8438,104.5195,897.8438,100.5195,893.8438" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2.0,2.0;" x1="98.5195" x2="679.8989" y1="893.8438" y2="893.8438"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="132.0186" x="110.5195" y="873.645">303 clean local path</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.8496" x="110.5195" y="888.7778">Secure HttpOnly SameSite=Strict cookie</text><polygon fill="#181818" points="401.9868,918.9766,411.9868,922.9766,401.9868,926.9766,405.9868,922.9766" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="93.5195" x2="407.9868" y1="922.9766" y2="922.9766"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.5693" x="100.5195" y="917.9106">GET SPA and /api with session cookie</text><polygon fill="#181818" points="668.8989,948.1094,678.8989,952.1094,668.8989,956.1094,672.8989,952.1094" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="413.9868" x2="674.8989" y1="952.1094" y2="952.1094"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="160.7607" x="420.9868" y="947.0435">Same-origin /api request</text><polygon fill="#181818" points="1237.8779,977.2422,1247.8779,981.2422,1237.8779,985.2422,1241.8779,981.2422" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="680.8989" x2="1243.8779" y1="981.2422" y2="981.2422"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203.0679" x="687.8989" y="976.1763">Reload active User and session</text><polygon fill="