<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="675px" preserveAspectRatio="none" style="width:1185px;height:675px;background:#FFFFFF;" version="1.1" viewBox="0 0 1185 675" width="1185px" zoomAndPan="magnify"><title>Shadow - AI Change Set Lifecycle (ADR-015)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="357.5742" x="406.7288" y="22.9951">Shadow - AI Change Set Lifecycle (ADR-015)</text><ellipse cx="739" cy="53.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="714" y="148.7969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="33.6396" x="722.1802" y="173.6436">draft</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="81.0596" x="487.5" y="319.7969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="71.0596" x="492.5" y="344.6436">submitted</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="78.4893" x="864" y="319.7969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68.4893" x="869" y="344.6436">discarded</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="61.6318" x="113" y="512.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="51.6318" x="118" y="537.1436">applied</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="67.5586" x="494" y="512.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="57.5586" x="499" y="537.1436">rejected</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="884" y="512.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="38.7871" x="889.6064" y="537.1436">failed</text><g id="elem_GMN2"><path d="M415,141.2969 L415,196.6953 A0,0 0 0 0 415,196.6953 L679.0708,196.6953 A0,0 0 0 0 679.0708,196.6953 L679.0708,172.7969 L713.85,168.7969 L679.0708,164.7969 L679.0708,151.2969 L669.0708,141.2969 L415,141.2969 A0,0 0 0 0 415,141.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M669.0708,141.2969 L669.0708,151.2969 L679.0708,151.2969 L669.0708,141.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.0708" x="421" y="158.3638">Only the creator's grants edit a draft.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.7437" x="421" y="173.4966">Dry-run stops at the first failing</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="222.3774" x="421" y="188.6294">operation: ok, error, then not_run.</text></g><g id="elem_GMN5"><path d="M48,289.2969 L48,390.0938 A0,0 0 0 0 48,390.0938 L451.8716,390.0938 A0,0 0 0 0 451.8716,390.0938 L451.8716,343.7969 L487.47,339.7969 L451.8716,335.7969 L451.8716,299.2969 L441.8716,289.2969 L48,289.2969 A0,0 0 0 0 48,289.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M441.8716,289.2969 L441.8716,299.2969 L451.8716,299.2969 L441.8716,289.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="310.7749" x="54" y="306.3638">Immutable. Only a human decides: in Shadow,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.1221" x="54" y="321.4966">or by approving apply_change_set or</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="382.8716" x="54" y="336.6294">reject_change_set (MCP_CHANGE_SET_REVIEW_ENABLED).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="295.4834" x="54" y="351.7622">Replacement flags and the review fingerprint</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245.5146" x="54" y="366.895">are recomputed against current data.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="294.6392" x="54" y="382.0278">The review records its channel (web or mcp).</text></g><g id="elem_GMN8"><path d="M6,613.2969 L6,668.6953 A0,0 0 0 0 6,668.6953 L281.9092,668.6953 A0,0 0 0 0 281.9092,668.6953 L281.9092,623.2969 L271.9092,613.2969 L148,613.2969 L144,552.3369 L140,613.2969 L6,613.2969 A0,0 0 0 0 6,613.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M271.9092,613.2969 L271.9092,623.2969 L281.9092,623.2969 L271.9092,613.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.9092" x="12" y="630.3638">Business rows written only through the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="237.1484" x="12" y="645.4966">domains' *_in_transaction cores; the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="147.3354" x="12" y="660.6294">reviewer is their actor.</text></g><g id="elem_GMN11"><path d="M759.5,613.2969 L759.5,668.6953 A0,0 0 0 0 759.5,668.6953 L1058.686,668.6953 A0,0 0 0 0 1058.686,668.6953 L1058.686,623.2969 L1048.686,613.2969 L913,613.2969 L909,552.3369 L905,613.2969 L759.5,613.2969 A0,0 0 0 0 759.5,613.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1048.686,613.2969 L1048.686,623.2969 L1058.686,623.2969 L1048.686,613.2969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278.186" x="765.5" y="630.3638">Everything rolled back, then marked failed</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="229.2139" x="765.5" y="645.4966">in a new transaction only while still</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.9575" x="765.5" y="660.6294">submitted. Not retried; stage a new one.</text></g><g id="elem_GMN14"><path d="M426,620.7969 L426,661.0625 A0,0 0 0 0 426,661.0625 L629.5269,661.0625 A0,0 0 0 0 629.5269,661.0625 L629.5269,630.7969 L619.5269,620.7969 L532,620.7969 L528,552.3369 L524,620.7969 L426,620.7969 A0,0 0 0 0 426,620.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M619.5269,620.7969 L619.5269,630.7969 L629.5269,630.7969 L619.5269,620.7969 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="182.5269" x="432" y="637.8638">applied, rejected, failed and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="151.8359" x="432" y="652.9966">discarded are terminal.</text></g><!--link *start* to draft--><g id="link_*start*_draft"><path d="M739,63.5869 C739,82.1169 739,118.0069 739,142.6669 " fill="none" id="*start*-to-draft" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="739,148.6669,743,139.6669,739,143.6669,735,139.6669,739,148.6669" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.6514" x="740" y="106.3638">create_change_set (MCP, write grant)</text></g><!--link draft to draft--><g id="link_draft_draft"><path d="M764.28,157.6269 C781.77,154.2469 799,157.9669 799,168.7969 C799,179.6269 787.661,184.4853 770.171,181.1053 " fill="none" id="draft-to-draft" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="764.28,179.9669,772.3575,185.6019,769.1892,180.9156,773.8755,177.7472,764.28,179.9669" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="231.3721" x="851.2268" y="158.3638">add_operations / remove_operation</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.0332" x="859.3962" y="173.4966">(scenario reference recomputed)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323.8257" x="805" y="188.6294">validate_change_set (dry-run, always rolled back)</text></g><!--link draft to submitted--><g id="link_draft_submitted"><path d="M713.84,187.8069 C708.16,191.3169 702.02,194.7069 696,197.2969 C645.1,219.1769 617.11,191.2869 575,227.2969 C547.06,251.1869 536.4468,288.6161 531.8368,313.6461 " fill="none" id="draft-to-submitted" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="530.75,319.5469,536.314,311.4203,531.6557,314.6296,528.4464,309.9712,530.75,319.5469" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="240.2334" x="576" y="240.3638">submit_change_set (creator's grant):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.9263" x="577.6536" y="255.4966">re-validate, freeze generated values</text></g><!--link draft to discarded--><g id="link_draft_discarded"><path d="M764.13,183.2369 C782.31,193.7169 806.78,209.4569 825,227.2969 C853.86,255.5569 875.9934,290.6073 889.4834,314.2173 " fill="none" id="draft-to-discarded" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="892.46,319.4269,891.4682,309.6281,889.9795,315.0855,884.522,313.5969,892.46,319.4269" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="238.564" x="854" y="247.8638">discard_change_set (creator's grant)</text></g><!--link submitted to applied--><g id="link_submitted_applied"><path d="M510.83,360.0569 C499.98,370.8769 485.01,383.5369 469,390.2969 C408.09,416.0169 223.22,377.2969 173,420.2969 C146.37,443.0969 142.5834,481.0172 142.8634,506.2372 " fill="none" id="submitted-to-applied" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="142.93,512.2369,146.8298,503.193,142.8745,507.2372,138.8303,503.2818,142.93,512.2369" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="226.1289" x="232.2366" y="433.3638">human apply in Shadow (web), or</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="342.6021" x="174" y="448.4966">apply_change_set approved in the MCP client (mcp):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.9111" x="228.3455" y="463.6294">lock, status, fingerprint, re-validate,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="145.0439" x="272.7791" y="478.7622">execute, commit once</text></g><!--link submitted to rejected--><g id="link_submitted_rejected"><path d="M526.96,360.0269 C525.64,387.2469 523.66,438.5769 525,482.2969 C525.3,492.1769 525.5469,497.1804 526.1569,506.2404 " fill="none" id="submitted-to-rejected" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="526.56,512.2269,529.9464,502.9785,526.2241,507.2382,521.9644,503.5159,526.56,512.2269" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="227.5508" x="582.0466" y="448.3638">human reject in Shadow (web), or</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339.644" x="526" y="463.4966">reject_change_set approved in the MCP client (mcp)</text></g><!--link submitted to failed--><g id="link_submitted_failed"><path d="M568.53,345.3169 C649.12,355.0769 825.57,380.4769 870,420.2969 C896.62,444.1469 904.4277,481.3014 907.1077,506.1914 " fill="none" id="submitted-to-failed" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="907.75,512.1569,910.7635,502.7804,907.2147,507.1856,902.8095,503.6368,907.75,512.1569" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.0317" x="904" y="440.8638">re-validation, operation or commit failure,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="245.1274" x="917.9521" y="455.9966">or a lock or statement timeout during</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="167.5781" x="956.7268" y="471.1294">re-validation or execution</text></g><!--link submitted to submitted--><g id="link_submitted_submitted"><path d="M568.78,322.1169 C587.35,320.3069 603.5,326.2069 603.5,339.7969 C603.5,353.3869 593.3217,359.8689 574.7517,358.0589 " fill="none" id="submitted-to-submitted" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="568.78,357.4769,577.3495,362.3311,573.7564,357.9619,578.1256,354.3688,568.78,357.4769" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.8198" x="609.5" y="329.3638">apply rejected in the lock, status or</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="195.3809" x="627.2195" y="344.4966">fingerprint step (review_stale,</text><text fill="