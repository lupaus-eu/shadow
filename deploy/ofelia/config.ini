; Reviewed, operator-owned Ofelia job file (ADR-013). Mounted read-only from the
; frozen release directory. Ofelia runs without --docker, so container labels
; are never read as jobs. Each job starts one pre-created, hardened Compose
; container; Ofelia creates, pulls and deletes nothing.
;
; Schedules use six cron fields (seconds first) in the explicit Europe/Helsinki
; timezone set on the Ofelia service. Failures are logged by Ofelia with the
; runner's nonzero exit code; there is no automatic retry.

[job-run "postgres-backup"]
; Daily at 02:30 Europe/Helsinki.
schedule = 0 30 2 * * *
container = shadow-backup-runner
no-overlap = true

[job-run "docker-cleanup"]
; Sundays at 04:30 Europe/Helsinki, after the daily backup.
schedule = 0 30 4 * * 0
container = shadow-docker-cleanup
no-overlap = true
